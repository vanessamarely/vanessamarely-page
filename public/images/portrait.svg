<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" role="img" aria-labelledby="portrait-title">
      <title id="portrait-title">Ilustración de Vanessa: cabello largo castaño, labios rojos y blazer azul</title>
      <style>
  .blob{opacity:.9}
  .ink{stroke:#1d1727;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .line{fill:none}.soft{stroke-width:1.4;opacity:.55}.brow{stroke:#2a1a16;stroke-width:5}.gold{stroke:#d9a63a;stroke-width:2.5}
  .blush{fill:#f08a8a;opacity:.35}
  .orbit{fill:none;stroke:#1d1727;stroke-width:1.2;stroke-dasharray:3 9;opacity:.35}
  .doodle path{fill:none;stroke:#1d1727;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
  .doodle--star path{fill:#ffc24b}.doodle--spark path{stroke:#f2665f}.doodle--pencil path{stroke:#6b5ce7}
</style>
      <defs>
        <!-- userSpaceOnUse: shade by position in the portrait, so every hair shape is dark at the top -->
        <linearGradient id="hair" gradientUnits="userSpaceOnUse" x1="0" y1="90" x2="0" y2="440">
          <stop offset="0" stop-color="#2a1a16" />
          <stop offset=".5" stop-color="#3a241c" />
          <stop offset="1" stop-color="#8a5a3b" />
        </linearGradient>
        <linearGradient id="blob" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#6b5ce7" />
          <stop offset="1" stop-color="#f2665f" />
        </linearGradient>
        <clipPath id="frame">
          <path d="M200 20 C 300 20 380 90 380 210 C 380 340 300 440 200 440 C 100 440 20 340 20 210 C 20 90 100 20 200 20 Z" />
        </clipPath>
      </defs>

      <!-- morphing background blob -->
      <path class="blob" fill="url(#blob)" d="M200 40 C 300 30 370 110 365 215 C 360 330 290 420 195 415 C 95 410 30 330 35 215 C 40 105 110 48 200 40 Z" />

      <g clip-path="url(#frame)">
        <!-- hair (back) -->
        <path class="ink" fill="url(#hair)" d="M200 82 C 128 82 96 140 98 215 C 100 285 86 345 64 405 C 100 418 140 410 158 392 L170 300 L230 300 L242 392 C 260 410 300 418 336 405 C 314 345 300 285 302 215 C 304 140 272 82 200 82 Z" />

        <!-- top -->
        <path class="ink" fill="#fbf7f2" d="M160 318 Q200 340 240 318 L222 445 L178 445 Z" />
        <!-- blazer -->
        <path class="ink" fill="#a9c6ec" d="M50 445 C 60 368 108 336 170 314 L194 445 Z" />
        <path class="ink" fill="#a9c6ec" d="M350 445 C 340 368 292 336 230 314 L206 445 Z" />
        <path class="ink line" d="M170 314 L152 342 L182 420 M230 314 L248 342 L218 420" />

        <!-- neck -->
        <path class="ink" fill="#e4a985" d="M176 268 L168 322 Q200 338 232 322 L224 268 Z" />

        <!-- face -->
        <path class="ink" fill="#f2c4a5" d="M200 116 C 246 116 274 150 274 200 C 274 242 258 270 232 285 C 216 294 184 294 168 285 C 142 270 126 242 126 200 C 126 150 154 116 200 116 Z" />

        <!-- blush -->
        <ellipse class="blush" cx="152" cy="238" rx="15" ry="8" />
        <ellipse class="blush" cx="248" cy="238" rx="15" ry="8" />

        <!-- hair (front strands + crown, middle part) -->
        <path class="ink" fill="url(#hair)" d="M150 132 C 118 170 114 238 120 300 C 124 350 110 392 96 430 C 128 430 152 412 162 386 C 170 340 150 300 148 250 C 146 200 156 166 176 136 Z" />
        <path class="ink" fill="url(#hair)" d="M250 132 C 282 170 286 238 280 300 C 276 350 290 392 304 430 C 272 430 248 412 238 386 C 230 340 250 300 252 250 C 254 200 244 166 224 136 Z" />
        <!-- crown: solid cap whose lower edge is the hairline, so no forehead shows through -->
        <path class="ink" fill="url(#hair)" d="M120 196 C 112 116 156 82 200 82 C 244 82 288 116 280 196 C 270 160 250 136 226 128 C 216 125 206 124 200 126 C 194 124 184 125 174 128 C 150 136 130 160 120 196 Z" />
        <!-- curtain bangs falling from the middle part -->
        <path class="ink" fill="url(#hair)" d="M201 116 C 168 116 132 136 124 194 C 146 162 172 144 201 138 Z" />
        <path class="ink" fill="url(#hair)" d="M199 116 C 232 116 268 136 276 194 C 254 162 228 144 199 138 Z" />
        <!-- middle part + hair highlights -->
        <path class="ink line soft" d="M200 86 C 199 100 199 114 200 128" />
        <path class="ink line soft" d="M136 200 C 132 250 140 300 132 360 M264 200 C 268 250 260 300 268 360 M180 96 C 160 102 142 118 134 140 M220 96 C 240 102 258 118 266 140" />

        <!-- brows -->
        <path class="ink line brow" d="M148 183 Q166 171 187 178" />
        <path class="ink line brow" d="M213 178 Q234 171 252 183" />

        <!-- eyes -->
        <g class="eye">
          <path class="ink" fill="#fff" d="M150 205 Q168 191 186 205 Q168 215 150 205 Z" />
          <g class="pupil">
            <circle cx="168" cy="204" r="6.5" fill="#4a2c1d" />
            <circle cx="168" cy="204" r="3" fill="#130c08" />
            <circle cx="170.5" cy="201.5" r="1.6" fill="#fff" />
          </g>
          <path class="ink line lid" d="M148 204 Q168 188 188 204" />
        </g>
        <g class="eye">
          <path class="ink" fill="#fff" d="M214 205 Q232 191 250 205 Q232 215 214 205 Z" />
          <g class="pupil">
            <circle cx="232" cy="204" r="6.5" fill="#4a2c1d" />
            <circle cx="232" cy="204" r="3" fill="#130c08" />
            <circle cx="234.5" cy="201.5" r="1.6" fill="#fff" />
          </g>
          <path class="ink line lid" d="M212 204 Q232 188 252 204" />
        </g>

        <!-- nose -->
        <path class="ink line soft" d="M201 212 Q197 232 192 240 Q199 246 209 241" />

        <!-- lips -->
        <path class="ink" fill="#c8323d" d="M180 259 Q190 251 200 256 Q210 251 220 259 Q200 263 180 259 Z" />
        <path class="ink" fill="#d9404a" d="M180 259 Q200 277 220 259 Q200 265 180 259 Z" />

        <!-- hoop earrings -->
        <circle class="ink line gold" cx="131" cy="252" r="7" />
        <circle class="ink line gold" cx="269" cy="252" r="7" />
      </g>

      <!-- orbit + doodles -->
      <circle class="orbit" cx="200" cy="225" r="196" />
      <g class="doodle doodle--code">
        <path d="M30 96 l-16 14 16 14 M58 96 l16 14 -16 14 M50 92 l-12 36" />
      </g>
      <g class="doodle doodle--star">
        <path d="M352 52 l7 17 18 1 -14 11 5 18 -16 -10 -16 10 5 -18 -14 -11 18 -1 Z" />
      </g>
      <g class="doodle doodle--spark">
        <path d="M360 330 v24 M348 342 h24 M352 334 l16 16 M368 334 l-16 16" />
      </g>
      <g class="doodle doodle--pencil">
        <path d="M24 360 l40 -40 10 10 -40 40 -14 4 z M58 326 l10 10" />
      </g>
    </svg>